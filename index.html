<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập Sử – Địa 8</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#d9d6cc;--acc:#1f4e8c;--ok:#1b7f4b;--okb:#e0f3e8;--bad:#b42318;--badb:#fde8e6;--sel:#e6eef9}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1d222d;--ink:#e8eaf0;--mut:#9aa3b5;--line:#343b4a;--acc:#7fb0ee;--ok:#5fd394;--okb:#17372a;--bad:#ff8e83;--badb:#40201d;--sel:#26344d}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}h1{font-size:1.5rem;margin:.4em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:700;margin-bottom:4px}
label{display:block;padding:6px 0;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
.go,.sub{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:11px 20px;font-weight:700}
.tag{font-size:.8rem;color:var(--mut)}.q{font-weight:600;margin:2px 0 8px}
.o{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0}
.o.sel{background:var(--sel);border-color:var(--acc)}.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.o.bad{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.st{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.st .o{display:inline-block;width:auto;min-width:84px;text-align:center;margin:4px 6px 0 0}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:2}
.res{font-size:1.2rem;font-weight:700;color:var(--acc)}
</style></head><body><main>
<h1>Ôn tập Lịch sử &amp; Địa lí 8</h1>
<div id="home"><div class="card">
<fieldset><legend>Môn</legend><label><input type="radio" name="s" value="all" checked> Cả hai môn</label><label><input type="radio" name="s" value="Sử"> Lịch sử</label><label><input type="radio" name="s" value="Địa"> Địa lí</label></fieldset>
<fieldset><legend>Thứ tự câu hỏi</legend><label><input type="radio" name="u" value="0" checked> Không đảo đề</label><label><input type="radio" name="u" value="1"> Đảo đề</label></fieldset>
<fieldset><legend>Cách xem đáp án</legend><label><input type="radio" name="m" value="now" checked> Chọn xong hiện đáp án ngay</label><label><input type="radio" name="m" value="end"> Làm hết rồi nộp bài mới hiện đáp án</label></fieldset>
<button class="go" onclick="start()">Bắt đầu làm bài</button></div></div>
<div id="quiz" hidden><div class="bar"><span id="prog"></span><button class="sub" id="sub" onclick="finish()"></button></div><div id="list"></div><div class="res" id="res"></div></div>
<script>
const M=(s,q,o,a)=>({s,q,o,a});
const T=(s,q,t)=>({s,q,t});
const D=[
M("Sử","Cuộc chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mỹ diễn ra dưới hình thức nào?",["Nội chiến giữa các bang","Chiến tranh giải phóng dân tộc","Cải cách ôn hòa","Chiến tranh xâm lược"],1),
M("Sử","Trước cách mạng, xã hội Pháp gồm những đẳng cấp nào?",["Tăng lữ, quý tộc và đẳng cấp thứ ba","Quý tộc, nông dân, công nhân","Tư sản, vô sản, địa chủ","Vua, quan lại, nông nô"],0),
M("Sử","Việc phát minh và sử dụng máy kéo sợi đã tác động như thế nào đến ngành dệt?",["Làm tăng năng suất kéo sợi, đáp ứng nhu cầu của ngành dệt","Làm ngành dệt phải thu hẹp","Chỉ phục vụ nông nghiệp","Không có tác động gì"],0),
M("Sử","Vì sao các nước phương Tây đẩy mạnh xâm lược Đông Nam Á từ nửa sau thế kỉ XVI?",["Vì Đông Nam Á nghèo tài nguyên","Vì Đông Nam Á có vị trí chiến lược, giàu tài nguyên và chế độ phong kiến suy yếu","Vì Đông Nam Á có quân đội rất mạnh","Vì nhân dân Đông Nam Á mời phương Tây vào"],1),
M("Sử","Nội dung nào KHÔNG phản ánh đúng tình hình nhà Lê đầu thế kỉ XVI?",["Triều đình suy yếu, vua ăn chơi xa xỉ","Nông dân khởi nghĩa ở nhiều nơi","Mạc Đăng Dung tiến hành khởi nghĩa lật đổ nhà Lê","Các tập đoàn phong kiến tranh giành quyền lực"],2),
M("Sử","Để thực thi chủ quyền đối với Hoàng Sa – Trường Sa, chúa Nguyễn Phúc Nguyên đã cho thành lập những hải đội nào?",["Hải đội Hoàng Sa và Bắc Hải","Hải đội Bắc Hải và Nam Hải","Hải đội Hoàng Sa và Trường Sa","Hải đội Đông Hải và Tây Hải"],0),
M("Sử","Cuộc chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mỹ đã đạt được kết quả nào?",["Lật đổ ách cai trị của thực dân Anh ở Bắc Mỹ","Anh giữ nguyên quyền cai trị","Bắc Mỹ bị Pháp thống trị","13 thuộc địa bị chia cắt"],0),
M("Sử","Trước cách mạng, nước Pháp tồn tại chế độ chính trị nào?",["Cộng hòa","Quân chủ lập hiến","Quân chủ chuyên chế","Dân chủ đại nghị"],2),
M("Sử","Vì sao Cách mạng công nghiệp làm nảy sinh những vấn đề xã hội?",["Vì sản xuất bị đình trệ","Vì quá trình công nghiệp hóa làm xuất hiện bóc lột lao động, bất bình đẳng và ô nhiễm môi trường","Vì không có máy móc","Vì dân số giảm mạnh"],1),
M("Sử","Vì sao nhân dân Đông Nam Á đấu tranh chống thực dân phương Tây?",["Để mở rộng buôn bán với phương Tây","Để bảo vệ đất nước và chống áp bức, bóc lột","Để thay đổi tôn giáo","Để chia lại lãnh thổ"],1),
M("Sử","Hậu quả trực tiếp của chiến tranh Trịnh – Nguyễn là gì?",["Đất nước được thống nhất","Đất nước bị chia cắt thành Đàng Trong và Đàng Ngoài","Nhà Mạc lên ngôi","Nhà Lê sụp đổ"],1),
M("Sử","Nội dung nào KHÔNG phản ánh đúng nhiệm vụ của hải đội Hoàng Sa dưới thời các chúa Nguyễn?",["Khai thác hải vật, đánh bắt hải sản","Thu lượm hàng hóa từ tàu đắm","Xây dựng các cảng quy mô lớn trên quần đảo Hoàng Sa","Đo đạc, vẽ bản đồ vùng biển"],2),
M("Sử","Cuộc xung đột Nam – Bắc triều ở Đại Việt (thế kỉ XVI) diễn ra giữa các thế lực phong kiến nào?",["Nhà Mạc – nhà Lê","Nhà Trịnh – nhà Nguyễn","Tây Sơn – chúa Nguyễn","Nhà Lý – nhà Trần"],0),
M("Sử","“Đàng Trong” là từ dùng để chỉ vùng đất từ:",["sông Gianh trở vào nam","sông Bến Hải trở ra bắc","đèo Ngang trở ra bắc","sông Hồng trở xuống"],0),
M("Sử","Khi soạn Tuyên ngôn Độc lập, Chủ tịch Hồ Chí Minh đã trích dẫn những câu nói nổi tiếng trong bản tuyên ngôn nào?",["Hiến pháp Mỹ 1787","Tuyên ngôn Nhân quyền và Dân quyền (Pháp, 1789)","Bình Ngô đại cáo","Hịch tướng sĩ"],1),
M("Địa","Việt Nam là một thể thống nhất toàn vẹn gồm:",["Vùng đất, vùng biển và vùng trời","Chỉ đất liền và hải đảo","Vùng đất và vùng trời","Vùng biển và hải đảo"],0),
M("Địa","Vùng biên giới Việt Nam giáp với các nước nào?",["Lào, Trung Quốc, Cam-pu-chia","Thái Lan, Lào, Cam-pu-chia","Trung Quốc, Mi-an-ma, Lào","Trung Quốc, Thái Lan, Cam-pu-chia"],0),
M("Địa","Địa hình Việt Nam có những hướng chính nào?",["Đông – Tây và hướng bắc – nam","Tây Bắc – Đông Nam và hướng vòng cung","Chỉ hướng bắc – nam","Chỉ hướng đông bắc – tây nam"],1),
M("Địa","Dãy Hoàng Liên Sơn thuộc khu vực nào của nước ta?",["Tây Bắc","Đông Bắc","Bắc Trung Bộ","Tây Nguyên"],0),
M("Địa","Đặc điểm nào sau đây đúng với địa hình Việt Nam?",["Chủ yếu là đồi núi thấp","Chủ yếu là đồng bằng","Chủ yếu là núi cao trên 2000 m","Chủ yếu là cao nguyên bằng phẳng"],0),
M("Địa","Khu vực nào sau đây được UNESCO công nhận là di sản thế giới?",["Vịnh Hạ Long","Vịnh Cam Ranh","Vịnh Vân Phong","Vịnh Thái Lan"],0),
T("Địa","Câu 1 – Vị trí địa lí và lãnh thổ Việt Nam",[["Vị trí nước ta nằm hoàn toàn ở nửa cầu Bắc.",1],["Vị trí nước ta nằm hoàn toàn ở nửa cầu Đông.",1],["Vị trí địa lí đã tạo nhiều thuận lợi cho nước ta phát triển các ngành kinh tế biển.",1],["Vị trí địa lí và hình dáng lãnh thổ có ảnh hưởng đến sông ngòi.",1]]),
T("Địa","Câu 2 – Tài nguyên khoáng sản và năng lượng",[["Than đá, dầu mỏ thuộc nhóm khoáng sản năng lượng.",1],["Phần lớn khoáng sản nước ta có trữ lượng lớn.",0],["Sự đa dạng của tài nguyên khoáng sản là do: Nước ta nằm ở vị trí giao thoa giữa hai vành đai sinh khoáng lớn của thế giới là vành đai Thái Bình Dương và Địa Trung Hải.",1],["Dùng năng lượng sạch giúp tiết kiệm, đảm bảo an ninh năng lượng quốc gia và bảo vệ môi trường.",1]]),
T("Sử","Câu 13 – Quý tộc mới ở Anh (đầu thế kỉ XVII)",[["Quý tộc mới giữ nguyên phương thức bóc lột địa tô truyền thống nhưng ủng hộ tư sản về chính trị.",0],["Kinh tế tư bản chủ nghĩa ở Anh phát triển hoàn toàn không bị kìm hãm và không gặp phản kháng nào từ chế độ phong kiến.",0],["“Rào đất cướp ruộng” là biểu hiện của sự tích lũy tư bản nguyên thủy, tước đoạt tư liệu sản xuất của nông dân.",1],["Sự xuất hiện của Quý tộc mới cho thấy có sự liên minh tự nhiên về lợi ích kinh tế giữa tầng lớp này với giai cấp tư sản, tạo thế lực chính trị đủ mạnh đối đầu với chế độ phong kiến.",1]]),
T("Sử","Câu 14 – Kinh tế Pháp trước cách mạng",[["Nông nghiệp Pháp cuối thế kỉ XVIII lạc hậu chủ yếu do điều kiện tự nhiên và khí hậu Tây Âu không thuận lợi.",0],["Chế độ phong kiến chuyên chế kìm hãm kinh tế tư bản chủ nghĩa qua phường hội độc quyền, thuế nặng và không có đơn vị đo lường thống nhất.",1],["Công thương nghiệp tư bản chủ nghĩa phát triển độc lập hoàn toàn, không chịu tác động gì từ sự bóc lột của chế độ phong kiến.",0],["Mâu thuẫn cơ bản của kinh tế Pháp trước 1789 là giữa lực lượng sản xuất mới (tư bản chủ nghĩa) với quan hệ sản xuất lỗi thời (phong kiến chuyên chế).",1]]),
T("Sử","Câu 15 – Nguyên nhân Chiến tranh giành độc lập ở Bắc Mỹ",[["Thuế tem, thuế trà do chính quốc áp đặt được cư dân thuộc địa đồng thuận cao vì coi là nghĩa vụ đóng góp cho hoàng gia.",0],["Nguyên nhân sâu xa là mâu thuẫn giữa sự phát triển kinh tế tư bản chủ nghĩa của 13 thuộc địa với chính sách kìm hãm, bóc lột của thực dân Anh.",1],["Sự phân hóa kinh tế Bắc – Nam đã ngăn cản họ đoàn kết chống lại thực dân Anh.",0],["Các lệnh cấm của Anh (cấm mở xưởng, cấm giao thương quốc tế) nhằm biến Bắc Mỹ thành thị trường tiêu thụ hàng hóa và nơi cung cấp nguyên liệu rẻ cho chính quốc.",1]]),
T("Sử","Câu 16 – Hạn chế của Cách mạng Pháp",[["Hạn chế lớn nhất là không lật đổ được chế độ phong kiến và vẫn giữ chế độ Ba đẳng cấp.",0],["Sau cách mạng, quần chúng lao động (công nhân, nông dân nghèo) vẫn bị bóc lột kinh tế.",1],["Cách mạng Pháp đã xóa bỏ tận gốc mọi hình thức bất bình đẳng và bóc lột trong xã hội.",0],["Bản chất hạn chế: thay chế độ bóc lột này bằng chế độ bóc lột khác tinh vi hơn, chưa xóa bỏ chế độ tư hữu – nguồn gốc của bất bình đẳng.",1]]),
T("Sử","Câu 20 – Khai phá Nam Bộ (Phan Huy Lê)",[["Khai phá Nam Bộ hiệu quả nhờ kết hợp lực lượng tiên phong (lưu dân) và vai trò quản lý, tổ chức của nhà nước (chúa Nguyễn).",1],["Việc Nguyễn Hữu Cảnh vào kinh lý năm 1698 đánh dấu lần đầu người Việt khai hoang những thửa ruộng ở Nam Bộ.",0],["Bản chất công cuộc mở cõi phương Nam là cuộc viễn chinh quân sự nhằm đồng hóa cư dân bản địa.",0],["Việc chúa Nguyễn đo đạc đất đai, lập sổ hộ là bước quyết định khẳng định chủ quyền quản lý của nhà nước với vùng đất mới.",1]]),
T("Sử","Câu 21 – Đông Nam Á trước làn sóng xâm lược phương Tây",[["Nguyên nhân duy nhất khiến Đông Nam Á bị xâm lược hoàn toàn là do phương Tây vượt trội về vũ khí, kĩ thuật quân sự.",0],["Khủng hoảng chính trị và kinh tế của chế độ phong kiến bản địa làm suy giảm khả năng phòng thủ của các quốc gia.",1],["Tư duy kinh tế đóng cửa, hạn chế giao thương đã gián tiếp tước đi cơ hội phát triển công nghệ và tăng cường quốc phòng.",1],["Phương Tây thâm nhập vào lúc quyền lực phong kiến Đông Nam Á đang lỏng lẻo và phân rã mạnh mẽ.",1]])
];
const $=id=>document.getElementById(id);let slots=[],mode,done=false;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function opt(slot,txt,i,box){const b=el("button","o",txt);b.onclick=()=>pick(slot,i);slot.btns.push(b);box.appendChild(b)}
function pick(s,i){if(s.locked)return;s.pick=i;s.btns.forEach((b,k)=>b.classList.toggle("sel",k==i));if(mode=="now")show(s);prog()}
function show(s){s.locked=true;s.btns.forEach((b,k)=>{b.classList.remove("sel");if(k==s.a)b.classList.add("ok");else if(k==s.pick)b.classList.add("bad")})}
function prog(){const n=slots.filter(s=>s.pick!=null).length;$("prog").textContent="Đã làm "+n+"/"+slots.length}
function start(){
 const f=n=>document.querySelector('input[name='+n+']:checked').value,sj=f("s");mode=f("m");
 let L=D.filter(d=>sj=="all"||d.s==sj);if(f("u")=="1")L=sh(L);
 slots=[];done=false;$("list").innerHTML="";$("res").textContent="";
 L.forEach((d,n)=>{const c=el("div","card");c.appendChild(el("div","tag","Câu "+(n+1)+" · "+d.s));
  if(d.o){c.appendChild(el("div","q",d.q));const s={a:d.a,btns:[],pick:null};d.o.forEach((t,i)=>opt(s,"ABCD"[i]+". "+t,i,c));slots.push(s)}
  else{c.appendChild(el("div","q",d.q+" — chọn Đúng hoặc Sai cho từng ý"));
   (f("u")=="1"?sh(d.t):d.t).forEach(([t,v],k)=>{const r=el("div","st");r.appendChild(el("div",null,"abcd"[k]+") "+t));const s={a:v?0:1,btns:[],pick:null};opt(s,"Đúng",0,r);opt(s,"Sai",1,r);slots.push(s);c.appendChild(r)})}
  $("list").appendChild(c)});
 $("sub").textContent=mode=="now"?"Xem điểm":"Nộp bài";
 $("home").hidden=true;$("quiz").hidden=false;prog();scrollTo(0,0)}
function finish(){
 if(done){$("home").hidden=false;$("quiz").hidden=true;return}
 done=true;slots.forEach(show);const ok=slots.filter(s=>s.pick==s.a).length;
 $("res").textContent="Kết quả: "+ok+"/"+slots.length+" ý đúng";$("sub").textContent="Làm lại";$("res").scrollIntoView({behavior:"smooth"})}
</script></main></body></html>
